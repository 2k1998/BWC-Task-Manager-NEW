# Optional standalone service. To reuse the paid backend without a second
# service or disk, follow the combined deployment settings in README.md.
services:
  - type: web
    name: bwc-mcp
    runtime: python
    plan: starter
    rootDir: mcp_server
    buildCommand: pip install .
    startCommand: bwc-mcp-remote
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: oauth-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BWC_API_URL
        sync: false
      # The issuer defaults to Render's assigned RENDER_EXTERNAL_URL.
      - key: BWC_MCP_DATABASE_PATH
        value: /var/data/bwc-mcp/oauth.sqlite3
      - key: BWC_MCP_ENCRYPTION_KEY
        sync: false
