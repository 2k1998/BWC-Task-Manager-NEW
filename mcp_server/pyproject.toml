[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bwc-mcp"
version = "0.1.0"
description = "Authenticated MCP tools for BWC Task Manager"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx==0.28.1", "cryptography>=42,<51", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
bwc-mcp = "bwc_mcp.remote:main"
bwc-mcp-stdio = "bwc_mcp.server:main"
bwc-mcp-login = "bwc_mcp.login:main"
bwc-mcp-remote = "bwc_mcp.remote:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
